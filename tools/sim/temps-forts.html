<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Temps forts · banc d'essai</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0d0f; color: #f3f2ee; font: 14px Inter, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  form { position: fixed; left: 12px; top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; background: rgba(12, 13, 15, .92); }
  select, button { font: inherit; padding: 6px 10px; background: #1d2024; color: inherit; border: 0; }
  button { background: #c7a15a; color: #120f08; font-weight: 600; }
  #state { position: fixed; right: 12px; top: 12px; padding: 8px 12px; background: rgba(12, 13, 15, .92); }
</style></head>
<body>
<form id="ui">
  <select id="kind"></select>
  <select id="outcome"><option value="goal">But</option><option value="saved">Arrêt</option><option value="wide">À côté</option><option value="post">Poteau</option><option value="red">Expulsion</option></select>
  <select id="side"><option value="home">Nous attaquons</option><option value="away">Ils attaquent</option></select>
  <button type="submit">Jouer</button>
</form>
<div id="state"></div>
<canvas id="c"></canvas>
<script type="module" src="./temps-forts.js"></script>
</body></html>

# Netlify : construit le jeu (Vite) puis publie le dossier dist sur footoff-empire.netlify.app
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# fichiers du build nommés avec une empreinte (index-XXXX.js…) : cache navigateur longue durée
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- pas de zoom de la page au doigt : la mise en page du jeu reste fixe (la caméra 3D garde son propre zoom) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#070707" />
    <title>FootOFF Empire — un jeu FootOFF Media</title>
    <meta name="description" content="Fonde ton club, bâtis ton complexe, monte jusqu’à l’Elite. Un jeu de gestion de football dans le navigateur, sur PC comme sur téléphone, par FootOFF Media." />
    <!-- partage (Messages, WhatsApp, X, Discord…) : titre, description, image 1200 × 630 (public/og.jpg). L'adresse
         absolue est celle de l'hébergeur de test ; à remplacer par footoff.media à la mise en ligne finale. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FootOFF Media" />
    <meta property="og:title" content="FootOFF Empire" />
    <meta property="og:description" content="Un terrain de quartier. Un empire à bâtir. Jeu de gestion de football, gratuit, dans le navigateur." />
    <meta property="og:url" content="https://footoff.github.io/FootOFF-Empire/" />
    <meta property="og:image" content="https://footoff.github.io/FootOFF-Empire/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FootOFF Empire : le monogramme doré et la devise « Un terrain de quartier. Un empire à bâtir. »" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FootOFF Empire" />
    <meta name="twitter:description" content="Un terrain de quartier. Un empire à bâtir. Jeu de gestion de football, gratuit, dans le navigateur." />
    <meta name="twitter:image" content="https://footoff.github.io/FootOFF-Empire/og.jpg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- installation sur l'écran d'accueil du téléphone : plein écran, icône et nom FootOFF -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="FootOFF Empire" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Écran de chargement : ses styles vivent ici, une seule fois, pour l'écran HTML d'avant le code du jeu comme
         pour sa version React (src/ui/loading.jsx), qui reprend exactement la même mise en page. -->
    <style>
      html, body { margin: 0; height: 100%; background: #070707; }
      .ld { position: fixed; inset: 0; z-index: 60; overflow: hidden; color: #f3f2ee; text-align: left;
        font-family: Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
        background: radial-gradient(ellipse 85% 65% at 50% 40%, #13211a 0%, #0a0f0c 46%, #070707 100%); }
      .ld::before { /* lignes du terrain, à peine visibles */
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(circle at 50% 41%, transparent 0 149px, rgba(255, 255, 255, .055) 150px 151px, transparent 152px),
          linear-gradient(90deg, transparent calc(50% - .5px), rgba(255, 255, 255, .045) 0 calc(50% + .5px), transparent 0);
        -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 41%, #000 30%, transparent 75%);
        mask-image: radial-gradient(ellipse 60% 55% at 50% 41%, #000 30%, transparent 75%); }
      .ld-glow { position: absolute; inset: -20%; pointer-events: none;
        background:
          radial-gradient(closest-side, rgba(199, 161, 90, .14), transparent) 28% 38% / 62% 62% no-repeat,
          radial-gradient(closest-side, rgba(124, 196, 151, .07), transparent) 72% 62% / 56% 56% no-repeat;
        animation: ld-drift 16s ease-in-out var(--ld-delay, 0s) infinite alternate; }
      @keyframes ld-drift { from { transform: translate3d(-3%, -2%, 0); } to { transform: translate3d(3%, 2%, 0) scale(1.06); } }
      .ld-center { position: absolute; left: 0; right: 0; top: 0; bottom: 18vh; display: grid; place-items: center; padding: 24px; }
      .ld-logo { display: inline-flex; align-items: center; gap: 22px; animation: ld-glowpulse 3.6s ease-in-out var(--ld-delay, 0s) infinite; }
      @keyframes ld-glowpulse { 50% { opacity: .8; } }
      .ld-mono { height: 84px; width: auto; flex-shrink: 0; }
      .ld-sep { width: 1px; align-self: stretch; margin: 2px; background: rgba(199, 161, 90, .38); }
      .ld-words { display: flex; flex-direction: column; line-height: 1; }
      .ld-name { font-weight: 500; font-size: 44px; letter-spacing: -.02em; }
      .ld-name b { font-weight: 500; color: #c7a15a; }
      .ld-sub { margin-top: 9px; font-weight: 500; font-size: 16px; letter-spacing: .55em; text-transform: uppercase; color: #c7a15a; }
      .ld-bottom { position: absolute; left: 48px; right: 48px; bottom: calc(40px + var(--host-badge-h, 0px)); display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
      .ld-tip { margin: 0; max-width: 520px; min-height: 68px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.55; color: rgba(243, 242, 238, .72); animation: ld-in .6s ease both; }
      .ld-tip-label { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #c7a15a; }
      @keyframes ld-in { from { opacity: 0; transform: translateY(6px); } }
      .ld-status { display: flex; align-items: center; gap: 14px; white-space: nowrap; flex-shrink: 0; }
      .ld-spin { width: 22px; height: 22px; fill: none; stroke: #c7a15a; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 30 100; animation: ld-spin 1.1s linear var(--ld-delay, 0s) infinite; }
      @keyframes ld-spin { to { transform: rotate(360deg); } }
      .ld-step { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #8b8b8b; }
      .ld-pct { font-family: Geist, Inter, system-ui, sans-serif; font-size: 15px; color: #8b8b8b; min-width: 84px; text-align: right; opacity: 0; transition: opacity .4s ease; }
      .ld[data-live] .ld-pct { opacity: 1; } /* le pourcentage n'apparaît qu'avec le vrai comptage (jamais un « 0 % » figé) */
      .ld-pct b { font-weight: 600; font-size: 36px; letter-spacing: -.02em; color: #f3f2ee; font-variant-numeric: tabular-nums; }
      .ld-bar { position: absolute; left: 0; right: 0; bottom: var(--host-badge-h, 0px); height: 3px; background: rgba(255, 255, 255, .07); overflow: hidden; }
      .ld-bar i, .ld-bar b { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0); background: linear-gradient(90deg, #b9924c, #c7a15a 60%, #dec17f); }
      /* démarrage : la barre avance seule, animée par la carte graphique (le processeur est alors occupé à lancer le
         moteur 3D et ne peut rien dessiner) ; la progression réelle (i, par-dessus) prend le relais */
      .ld-bar b { animation: ld-boot 7s cubic-bezier(.12, .7, .3, 1) var(--ld-delay, 0s) forwards; }
      @keyframes ld-boot { to { transform: scaleX(.16); } }
      .ld-bar::after { /* reflet qui parcourt la barre (animé par la carte graphique : vivant même quand le processeur décode un modèle) */
        content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 18%;
        background: linear-gradient(90deg, transparent, rgba(255, 236, 196, .55), transparent);
        animation: ld-sheen 2.2s ease-in-out var(--ld-delay, 0s) infinite; }
      @keyframes ld-sheen { from { transform: translateX(-100%); } to { transform: translateX(560%); } }
      .leaving > .ld { animation: ld-out .5s ease both !important; }
      @keyframes ld-out { to { opacity: 0; } }
      /* Téléphone : la progression sous le logo, juste sous le rond central (collée au bas de l'écran, la barre
         passait sous la barre d'outils du navigateur ou le trait d'accueil du téléphone) ; l'astuce en bas. Le bloc
         du bas n'est plus positionné : la barre, l'étape et l'astuce se placent chacune par rapport à l'écran. */
      @media (max-width: 760px) {
        .ld { --ld-mid: 41%; --ld-w: min(320px, calc(100% - 48px)); }
        .ld-center { bottom: 18%; }
        .ld-logo { gap: 14px; } .ld-mono { height: 58px; } .ld-name { font-size: 32px; } .ld-sub { font-size: 12px; margin-top: 7px; }
        .ld-bottom { position: static; }
        .ld-bar { left: 50%; right: auto; bottom: auto; top: calc(var(--ld-mid) + 176px); width: var(--ld-w); transform: translateX(-50%); border-radius: 2px; }
        .ld-status { position: absolute; left: 50%; top: calc(var(--ld-mid) + 192px); width: var(--ld-w); transform: translateX(-50%); justify-content: space-between; gap: 10px; }
        .ld-spin { width: 18px; height: 18px; }
        .ld-step { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; letter-spacing: .14em; }
        .ld-pct { min-width: 0; }
        .ld-pct b { font-size: 28px; }
        .ld-tip { position: absolute; left: 24px; right: 24px; bottom: calc(28px + env(safe-area-inset-bottom, 0px) + var(--host-badge-h, 0px)); min-height: 92px; font-size: 13px; }
      }
      @media (prefers-reduced-motion: reduce) { .ld-glow, .ld-logo, .ld-bar::after { animation: none; } .ld-spin { animation-duration: 3s; } .ld-bar b { animation-duration: 1ms; } }
      /* navigateur trop ancien, ou jeu qui ne démarre pas : un message à la place de la barre */
      .ld-old { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); width: min(520px, calc(100% - 48px)); text-align: center; font-size: 15px; line-height: 1.6; color: rgba(243, 242, 238, .85); }
      .ld-old b { display: block; margin-bottom: 8px; font-family: Geist, Inter, system-ui, sans-serif; font-size: 20px; font-weight: 500; color: #f3f2ee; }
      .ld-old a, .ld-old button { display: inline-block; margin-top: 14px; padding: 10px 22px; border-radius: 999px; border: 1px solid rgba(199, 161, 90, .5); background: none; color: #dec17f; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
      .ld.old .ld-bottom, .ld.old .ld-bar { display: none; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ld" role="status" aria-label="Chargement de FootOFF Empire">
        <div class="ld-glow" aria-hidden="true"></div>
        <div class="ld-center">
          <div class="ld-logo">
            <svg class="ld-mono" viewBox="594 256 744 768" aria-hidden="true">
              <defs>
                <linearGradient id="fo-boot" gradientUnits="userSpaceOnUse" x1="940" y1="640" x2="1180" y2="300">
                  <stop offset="0" stop-color="#B9924C" /><stop offset="0.55" stop-color="#B9924C" /><stop offset="1" stop-color="#DEC17F" />
                </linearGradient>
              </defs>
              <path d="M594 256H1035V351H689V588H770.6A300 300 0 0 0 744.5 662H689V835L594 938Z" fill="url(#fo-boot)" />
              <path d="M770.6 588A300 300 0 1 1 744.5 662H829A218 218 0 1 0 867.6 588Z" fill="url(#fo-boot)" />
            </svg>
            <span class="ld-sep" aria-hidden="true"></span>
            <span class="ld-words"><span class="ld-name">Foot<b>OFF</b></span><span class="ld-sub">Empire</span></span>
          </div>
        </div>
        <div class="ld-bottom">
          <p class="ld-tip"></p>
          <div class="ld-status">
            <svg class="ld-spin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /></svg>
            <span class="ld-step">Démarrage du moteur</span>
            <span class="ld-pct"><b>0</b> %</span>
          </div>
        </div>
        <div class="ld-bar" aria-hidden="true"><b></b><i></i></div>
      </div>
    </div>
    <script>
      // Instant de départ : l'écran React (src/ui/loading.jsx) reprend les animations là où elles en sont.
      window.__foBoot = { t0: performance.now(), started: false };
      // Navigateur trop ancien (le code du jeu demande iOS 16.4 / Safari 16.4, Chrome 98, Firefox 110 ou plus récent) :
      // un message clair plutôt qu'un chargement qui n'aboutit jamais. Et si le jeu n'a pas démarré après 25 s (script
      // non chargé, réseau coupé à la première visite), un message avec un bouton pour réessayer.
      (function () {
        var ld = document.querySelector('.ld');
        function message(html) { if (!ld) return; ld.className += ' old'; var d = document.createElement('div'); d.className = 'ld-old'; d.innerHTML = html; ld.appendChild(d); }
        var ok = false;
        try {
          ok = !!window.WebGLRenderingContext && typeof window.CompressionStream === 'function' && [].at
            && new Function('return (null ?? 1) === 1 && ({}).a?.b === undefined && /(?<=a)b/.test("ab")')();
        } catch (e) { ok = false; }
        if (!ok) {
          message('<b>Ce navigateur est trop ancien pour FootOFF Empire</b>Il faut au moins iOS 16.4 (Safari), ou une version récente de Chrome, Edge ou Firefox. Mets ton appareil à jour, puis reviens : ta partie t’attendra.');
          window.__foBoot.unsupported = true;
          return;
        }
        setTimeout(function () {
          if (window.__foBoot.started) return;
          message('<b>Le jeu n’a pas pu démarrer</b>Vérifie ta connexion, puis réessaie. Si le problème persiste, ferme complètement l’app ou l’onglet et rouvre-le.<br><button type="button" onclick="location.reload()">Réessayer</button>');
        }, 25000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
